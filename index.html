<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <title>Calculadora Avançada</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="icons/icon-512x512.png" type="image/png">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="previous-operand" id="previous-operand"></div>
            <div class="current-operand" id="current-operand"></div>
        </div>
        
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="basic">Básico</button>
            <button class="mode-btn" data-mode="scientific">Científico</button>
            <button class="mode-btn" data-mode="programmer">Programador</button>
            <button class="mode-btn" data-mode="graphic">Gráfico</button>
        </div>
        
        <div class="buttons basic-mode">
            <button class="span-2" data-action="clear">AC</button>
            <button data-action="delete">DEL</button>
            <button data-action="operation">÷</button>
            
            <button data-action="number">7</button>
            <button data-action="number">8</button>
            <button data-action="number">9</button>
            <button data-action="operation">×</button>
            
            <button data-action="number">4</button>
            <button data-action="number">5</button>
            <button data-action="number">6</button>
            <button data-action="operation">-</button>
            
            <button data-action="number">1</button>
            <button data-action="number">2</button>
            <button data-action="number">3</button>
            <button data-action="operation">+</button>
            
            <button class="span-2" data-action="number">0</button>
            <button data-action="number">.</button>
            <button data-action="calculate">=</button>
        </div>
        
        <div class="buttons scientific-mode hidden">
            <!-- Botões científicos serão adicionados via JavaScript -->
        </div>
        
        <div class="buttons programmer-mode hidden">
            <!-- Botões de programador serão adicionados via JavaScript -->
        </div>
    </div>
    
    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registrado com sucesso:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Falha ao registrar ServiceWorker:', error);
                    });
            });
        }
    </script>
</body>
</html>
