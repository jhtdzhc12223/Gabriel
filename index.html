<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusCalc - Calculadora Científica Futurista</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="cyber-container">
        <div class="holographic-display" id="display">
            <div class="display-main" id="main-display">0</div>
            <div class="display-secondary" id="secondary-display"></div>
            <div class="display-memory" id="memory-display"></div>
        </div>
        
        <div class="cyber-controls">
            <div class="control-panel">
                <button class="cyber-btn mode-btn" data-mode="basic">Básico</button>
                <button class="cyber-btn mode-btn active" data-mode="scientific">Científico</button>
                <button class="cyber-btn mode-btn" data-mode="programmer">Programador</button>
                <button class="cyber-btn mode-btn" data-mode="graph">Gráficos</button>
            </div>
            
            <div class="cyber-keyboard">
                <!-- Row 1 -->
                <button class="cyber-btn func-btn" data-func="second">2nd</button>
                <button class="cyber-btn func-btn" data-func="sin">sin</button>
                <button class="cyber-btn func-btn" data-func="cos">cos</button>
                <button class="cyber-btn func-btn" data-func="tan">tan</button>
                <button class="cyber-btn op-btn" data-op="^">x^y</button>
                <button class="cyber-btn op-btn" data-op="√">√x</button>
                <button class="cyber-btn op-btn" data-op="!">x!</button>
                <button class="cyber-btn clear-btn" data-clear="C">C</button>
                
                <!-- Row 2 -->
                <button class="cyber-btn func-btn" data-func="pi">π</button>
                <button class="cyber-btn func-btn" data-func="sinh">sinh</button>
                <button class="cyber-btn func-btn" data-func="cosh">cosh</button>
                <button class="cyber-btn func-btn" data-func="tanh">tanh</button>
                <button class="cyber-btn op-btn" data-op="(">(</button>
                <button class="cyber-btn op-btn" data-op=")">)</button>
                <button class="cyber-btn op-btn" data-op="%">%</button>
                <button class="cyber-btn clear-btn" data-clear="CE">CE</button>
                
                <!-- Row 3 -->
                <button class="cyber-btn func-btn" data-func="e">e</button>
                <button class="cyber-btn func-btn" data-func="log">log</button>
                <button class="cyber-btn func-btn" data-func="ln">ln</button>
                <button class="cyber-btn func-btn" data-func="exp">EXP</button>
                <button class="cyber-btn num-btn" data-num="7">7</button>
                <button class="cyber-btn num-btn" data-num="8">8</button>
                <button class="cyber-btn num-btn" data-num="9">9</button>
                <button class="cyber-btn op-btn" data-op="/">÷</button>
                
                <!-- Row 4 -->
                <button class="cyber-btn func-btn" data-func="rand">RAND</button>
                <button class="cyber-btn func-btn" data-func="abs">|x|</button>
                <button class="cyber-btn func-btn" data-func="floor">⌊x⌋</button>
                <button class="cyber-btn func-btn" data-func="ceil">⌈x⌉</button>
                <button class="cyber-btn num-btn" data-num="4">4</button>
                <button class="cyber-btn num-btn" data-num="5">5</button>
                <button class="cyber-btn num-btn" data-num="6">6</button>
                <button class="cyber-btn op-btn" data-op="*">×</button>
                
                <!-- Row 5 -->
                <button class="cyber-btn func-btn" data-func="mod">MOD</button>
                <button class="cyber-btn func-btn" data-func="gcd">GCD</button>
                <button class="cyber-btn func-btn" data-func="lcm">LCM</button>
                <button class="cyber-btn func-btn" data-func="10^x">10^x</button>
                <button class="cyber-btn num-btn" data-num="1">1</button>
                <button class="cyber-btn num-btn" data-num="2">2</button>
                <button class="cyber-btn num-btn" data-num="3">3</button>
                <button class="cyber-btn op-btn" data-op="-">-</button>
                
                <!-- Row 6 -->
                <button class="cyber-btn func-btn" data-func="bin">BIN</button>
                <button class="cyber-btn func-btn" data-func="hex">HEX</button>
                <button class="cyber-btn func-btn" data-func="oct">OCT</button>
                <button class="cyber-btn func-btn" data-func="deg">DEG</button>
                <button class="cyber-btn num-btn" data-num="0">0</button>
                <button class="cyber-btn num-btn" data-num=".">.</button>
                <button class="cyber-btn op-btn" data-op="±">±</button>
                <button class="cyber-btn op-btn" data-op="+">+</button>
                
                <!-- Row 7 -->
                <button class="cyber-btn func-btn" data-func="mem-clear">MC</button>
                <button class="cyber-btn func-btn" data-func="mem-recall">MR</button>
                <button class="cyber-btn func-btn" data-func="mem-add">M+</button>
                <button class="cyber-btn func-btn" data-func="mem-sub">M-</button>
                <button class="cyber-btn equals-btn" data-op="=">=</button>
            </div>
        </div>
        
        <div class="cyber-effects">
            <div class="neon-line"></div>
            <div class="grid-overlay"></div>
            <div class="particle-container" id="particles"></div>
        </div>
    </div>
    
    <div class="cyber-terminal">
        <div class="terminal-header">
            <span class="terminal-title">NexusCalc v3.14 - Console</span>
            <span class="terminal-controls">
                <i class="fas fa-minus"></i>
                <i class="fas fa-square"></i>
                <i class="fas fa-times"></i>
            </span>
        </div>
        <div class="terminal-body" id="terminal-output">
            <div>> Sistema NexusCalc inicializado</div>
            <div>> Modo científico ativado</div>
            <div>> Pronto para cálculos</div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
