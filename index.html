<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NexusCalc Quantum - Calculadora Científica Futurista</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-512x512.png">
    <link rel="shortcut icon" href="favicon.ico">
    <meta name="theme-color" content="#0a0a12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NexusCalc">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.2.0/math.min.js"></script>
</head>
<body>
    <div class="cyber-grid">
        <div class="cyber-calculator">
            <div class="cyber-housing">
                <div class="holographic-display" id="display">
                    <div class="display-main" id="main-display">0</div>
                    <div class="display-secondary" id="secondary-display"></div>
                    <div class="display-memory" id="memory-display"></div>
                    <div class="display-mode" id="mode-display">MODO: CIENTÍFICO</div>
                </div>
                
                <div class="cyber-controls">
                    <div class="control-panel">
                        <button class="cyber-btn mode-btn" data-mode="basic" aria-label="Modo básico">
                            <span class="btn-icon"><i class="fas fa-calculator"></i></span>
                            <span class="btn-text">BÁSICO</span>
                        </button>
                        <button class="cyber-btn mode-btn active" data-mode="scientific" aria-label="Modo científico">
                            <span class="btn-icon"><i class="fas fa-atom"></i></span>
                            <span class="btn-text">CIENTÍFICO</span>
                        </button>
                        <button class="cyber-btn mode-btn" data-mode="programmer" aria-label="Modo programador">
                            <span class="btn-icon"><i class="fas fa-code"></i></span>
                            <span class="btn-text">PROGRAMADOR</span>
                        </button>
                        <button class="cyber-btn mode-btn" data-mode="graph" aria-label="Modo gráficos">
                            <span class="btn-icon"><i class="fas fa-project-diagram"></i></span>
                            <span class="btn-text">GRÁFICOS</span>
                        </button>
                    </div>
                    
                    <div class="cyber-keyboard">
                        <!-- Linha 1 - Funções superiores -->
                        <button class="cyber-btn func-btn" data-func="second" aria-label="Função secundária">
                            <span class="func-primary">2nd</span>
                            <span class="func-secondary">SHIFT</span>
                        </button>
                        <button class="cyber-btn func-btn" data-func="sin" aria-label="Seno">
                            <span class="func-primary">sin</span>
                            <span class="func-secondary">sin⁻¹</span>
                        </button>
                        <button class="cyber-btn func-btn" data-func="cos" aria-label="Cosseno">
                            <span class="func-primary">cos</span>
                            <span class="func-secondary">cos⁻¹</span>
                        </button>
                        <button class="cyber-btn func-btn" data-func="tan" aria-label="Tangente">
                            <span class="func-primary">tan</span>
                            <span class="func-secondary">tan⁻¹</span>
                        </button>
                        
                        <!-- Linha 2 - Mais funções -->
                        <button class="cyber-btn func-btn" data-func="pi" aria-label="Pi">
                            <span class="func-primary">π</span>
                            <span class="func-secondary">3.1415</span>
                        </button>
                        <button class="cyber-btn func-btn" data-func="sinh" aria-label="Seno hiperbólico">
                            <span class="func-primary">sinh</span>
                            <span class="func-secondary">sinh⁻¹</span>
                        </button>
                        <button class="cyber-btn func-btn" data-func="cosh" aria-label="Cosseno hiperbólico">
                            <span class="func-primary">cosh</span>
                            <span class="func-secondary">cosh⁻¹</span>
                        </button>
                        <button class="cyber-btn func-btn" data-func="tanh" aria-label="Tangente hiperbólica">
                            <span class="func-primary">tanh</span>
                            <span class="func-secondary">tanh⁻¹</span>
                        </button>
                        
                        <!-- Linha 3 - Números 7,8,9 e divisão -->
                        <button class="cyber-btn num-btn" data-num="7" aria-label="7">
                            <span class="num-char">7</span>
                        </button>
                        <button class="cyber-btn num-btn" data-num="8" aria-label="8">
                            <span class="num-char">8</span>
                        </button>
                        <button class="cyber-btn num-btn" data-num="9" aria-label="9">
                            <span class="num-char">9</span>
                        </button>
                        <button class="cyber-btn op-btn" data-op="/" aria-label="Dividir">
                            <span class="op-symbol">÷</span>
                        </button>
                        
                        <!-- Linha 4 - Números 4,5,6 e multiplicação -->
                        <button class="cyber-btn num-btn" data-num="4" aria-label="4">
                            <span class="num-char">4</span>
                        </button>
                        <button class="cyber-btn num-btn" data-num="5" aria-label="5">
                            <span class="num-char">5</span>
                        </button>
                        <button class="cyber-btn num-btn" data-num="6" aria-label="6">
                            <span class="num-char">6</span>
                        </button>
                        <button class="cyber-btn op-btn" data-op="*" aria-label="Multiplicar">
                            <span class="op-symbol">×</span>
                        </button>
                        
                        <!-- Linha 5 - Números 1,2,3 e subtração -->
                        <button class="cyber-btn num-btn" data-num="1" aria-label="1">
                            <span class="num-char">1</span>
                        </button>
                        <button class="cyber-btn num-btn" data-num="2" aria-label="2">
                            <span class="num-char">2</span>
                        </button>
                        <button class="cyber-btn num-btn" data-num="3" aria-label="3">
                            <span class="num-char">3</span>
                        </button>
                        <button class="cyber-btn op-btn" data-op="-" aria-label="Subtrair">
                            <span class="op-symbol">−</span>
                        </button>
                        
                        <!-- Linha 6 - 0, ponto decimal, igual e adição -->
                        <button class="cyber-btn func-btn" data-func="mem-clear" aria-label="Limpar memória">
                            <span class="func-primary">MC</span>
                            <span class="func-secondary">MEM CLR</span>
                        </button>
                        <button class="cyber-btn num-btn" data-num="0" aria-label="0">
                            <span class="num-char">0</span>
                        </button>
                        <button class="cyber-btn num-btn" data-num="." aria-label="Ponto decimal">
                            <span class="num-char">.</span>
                            <span class="num-subchar">·</span>
                        </button>
                        <button class="cyber-btn op-btn" data-op="+" aria-label="Somar">
                            <span class="op-symbol">+</span>
                        </button>
                        
                        <!-- Linha 7 - Botão de igual -->
                        <button class="cyber-btn equals-btn" data-op="=" aria-label="Igual">
                            <span class="equals-symbol">=</span>
                            <span class="equals-subtext">ENTER</span>
                        </button>
                    </div>
                </div>
                
                <!-- Painel do Modo Programador -->
                <div class="programmer-panel mode-panel" id="programmer-panel">
                    <!-- Conteúdo mantido igual -->
                </div>
                
                <!-- Painel do Modo Gráfico -->
                <div class="graph-panel mode-panel" id="graph-panel">
                    <!-- Conteúdo mantido igual -->
                </div>
                
                <div class="cyber-branding">
                    <div class="brand-name">NEXUSCALC QUANTUM</div>
                    <div class="brand-version">v3.14159265</div>
                </div>
                
                <div class="cyber-effects">
                    <div class="neon-line"></div>
                    <div class="grid-overlay"></div>
                    <div class="particle-container" id="particles"></div>
                </div>

                <div class="theme-switcher">
                    <div class="theme-btn purple-blue" data-theme="purple-blue" aria-label="Tema roxo e azul"></div>
                    <div class="theme-btn cyber-green" data-theme="cyber-green" aria-label="Tema verde cyber"></div>
                    <div class="theme-btn matrix" data-theme="matrix" aria-label="Tema matrix"></div>
                    <div class="theme-btn dark-red" data-theme="dark-red" aria-label="Tema vermelho escuro"></div>
                </div>
            </div>
        </div>
        
        <!-- Painel Direito - Terminal e Histórico -->
        <div class="cyber-terminal-panel">
            <!-- Conteúdo mantido igual -->
        </div>
    </div>
    
    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registrado com sucesso:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Falha ao registrar ServiceWorker:', error);
                    });
            });
        }
    </script>
</body>
</html>
